<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Kenven Service</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/dark.css">
    <link rel="stylesheet" href="css/cart.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar scrolled" id="navbar">
    <div class="container nav-container">
        <a href="index.html" class="logo">
            <img src="https://cdn.phototourl.com/free/2026-08-08-326ff550-00c6-4a31-b9c8-9d038049a364.jpg" alt="Kenven Logo">
            <span>Kenven Service</span>
        </a>
        <ul class="nav-menu" id="navMenu">
            <li><a href="index.html" data-en="Home" data-ar="الرئيسية">Home</a></li>
            <li><a href="services.html" data-en="Services" data-ar="الخدمات">Services</a></li>
            <li><a href="portfolio.html" data-en="Portfolio" data-ar="أعمالي">Portfolio</a></li>
            <li><a href="about.html" data-en="About" data-ar="من أنا">About</a></li>
            <li><a href="contact.html" data-en="Contact" data-ar="تواصل">Contact</a></li>
        </ul>
        <div class="nav-actions">
            <button class="icon-btn lang-btn" id="langBtn"><i class="fa-solid fa-globe"></i><span>AR</span></button>
            <button class="icon-btn theme-btn" id="themeBtn"><i class="fa-solid fa-moon"></i></button>
            <a href="cart.html" class="cart-btn">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-count" id="cartCount">0</span>
            </a>
            <button class="menu-toggle" id="menuToggle"><span></span><span></span><span></span></button>
        </div>
    </div>
</nav>

<!-- Page Header -->
<section class="page-header">
    <div class="container">
        <h1 data-en="Shopping Cart" data-ar="سلة المشتريات">Shopping Cart</h1>
        <p data-en="Review your selected services" data-ar="راجع الخدمات التي اخترتها">Review your selected services</p>
    </div>
</section>

<!-- Cart Content -->
<section class="section">
    <div class="container">
        <div class="cart-page-grid" style="display: grid; grid-template-columns: 2fr 1fr; gap: 40px; align-items: start;">
            
            <!-- Cart Items -->
            <div class="cart-items-section">
                <div id="cartPageItems" class="cart-page-items"></div>
            </div>

            <!-- Order Summary -->
            <div class="order-summary" style="position: sticky; top: 100px;">
                <div class="card" style="padding: 30px;">
                    <h3 style="font-size: 20px; margin-bottom: 24px;" data-en="Order Summary" data-ar="ملخص الطلب">Order Summary</h3>
                    
                    <div style="display: flex; justify-content: space-between; margin-bottom: 12px; color: var(--text-muted);">
                        <span data-en="Subtotal" data-ar="المجموع الفرعي">Subtotal</span>
                        <span id="summarySubtotal">$0</span>
                    </div>
                    
                    <div style="display: flex; justify-content: space-between; margin-bottom: 12px; color: var(--text-muted);">
                        <span data-en="Tax (5%)" data-ar="الضريبة (5%)">Tax (5%)</span>
                        <span id="summaryTax">$0</span>
                    </div>
                    
                    <div style="display: flex; justify-content: space-between; margin-bottom: 12px; color: var(--text-muted);">
                        <span data-en="Discount" data-ar="الخصم">Discount</span>
                        <span id="summaryDiscount" style="color: #10b981;">-$0</span>
                    </div>
                    
                    <hr style="border: none; border-top: 1px solid var(--light-3); margin: 16px 0;">
                    
                    <div style="display: flex; justify-content: space-between; font-size: 22px; font-weight: 800; margin-bottom: 24px;">
                        <span data-en="Total" data-ar="الإجمالي">Total</span>
                        <span id="summaryTotal" style="background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">$0</span>
                    </div>

                    <!-- Coupon -->
                    <div style="display: flex; gap: 8px; margin-bottom: 20px;">
                        <input type="text" id="couponInput" placeholder="Coupon code" data-placeholder-en="Coupon code" data-placeholder-ar="كود الخصم" style="flex: 1; padding: 12px 16px; border: 2px solid var(--light-3); border-radius: 10px; background: white;">
                        <button class="btn btn-primary" id="applyCoupon" style="padding: 12px 20px;" data-en="Apply" data-ar="تطبيق">Apply</button>
                    </div>
                    <p id="couponMessage" style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;"></p>

                    <a href="checkout.html" class="btn btn-primary btn-block btn-lg" id="proceedCheckout">
                        <i class="fa-solid fa-lock"></i>
                        <span data-en="Proceed to Checkout" data-ar="المتابعة للدفع">Proceed to Checkout</span>
                    </a>

                    <a href="services.html" class="btn btn-outline btn-block" style="margin-top: 12px;">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span data-en="Continue Shopping" data-ar="مواصلة التسوق">Continue Shopping</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Footer -->
<footer class="footer">
    <div class="container">
        <div class="footer-bottom">
            <p>&copy; 2026 Kenven Service.</p>
        </div>
    </div>
</footer>

<button class="scroll-top visible" id="scrollTop"><i class="fa-solid fa-arrow-up"></i></button>

<script src="js/translations.js"></script>
<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const cartItemsContainer = document.getElementById('cartPageItems');
    const couponCodes = { 'KENVEN10': 0.10, 'WELCOME20': 0.20, 'VIP50': 0.50 };
    let appliedDiscount = 0;

    function renderCartPage() {
        const lang = document.documentElement.getAttribute('lang') || 'en';
        const items = window.cart.items;

        if (items.length === 0) {
            cartItemsContainer.innerHTML = `
                <div style="text-align: center; padding: 80px 20px;">
                    <i class="fa-solid fa-cart-shopping" style="font-size: 64px; color: var(--light-3); margin-bottom: 20px;"></i>
                    <h3 style="margin-bottom: 12px;" data-en="Your cart is empty" data-ar="سلتك فارغة">${lang === 'ar' ? 'سلتك فارغة' : 'Your cart is empty'}</h3>
                    <p style="color: var(--text-muted); margin-bottom: 24px;" data-en="Browse our services and add something you like" data-ar="تصفح خدماتنا وأضف ما يعجبك">${lang === 'ar' ? 'تصفح خدماتنا وأضف ما يعجبك' : 'Browse our services and add something you like'}</p>
                    <a href="services.html" class="btn btn-primary btn-lg">
                        <span data-en="Browse Services" data-ar="تصفح الخدمات">${lang === 'ar' ? 'تصفح الخدمات' : 'Browse Services'}</span>
                    </a>
                </div>
            `;
            updateSummary();
            return;
        }

        cartItemsContainer.innerHTML = items.map(item => `
            <div class="card" style="margin-bottom: 16px; padding: 24px; display: flex; gap: 20px; align-items: center;">
                <div style="width: 100px; height: 100px; border-radius: 16px; background-image: url('${item.image}'); background-size: cover; background-position: center; flex-shrink: 0;"></div>
                <div style="flex: 1;">
                    <h4 style="font-size: 18px; margin-bottom: 6px;">${item.title[lang]}</h4>
                    <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 8px;">$${item.price} × ${item.quantity}</p>
                    <div class="quantity-controls">
                        <button class="qty-btn" data-action="decrease" data-id="${item.id}">−</button>
                        <span class="qty-value">${item.quantity}</span>
                        <button class="qty-btn" data-action="increase" data-id="${item.id}">+</button>
                    </div>
                </div>
                <div style="text-align: right;">
                    <p style="font-size: 22px; font-weight: 800; color: var(--primary); margin-bottom: 12px;">$${(item.price * item.quantity).toFixed(2)}</p>
                    <button class="remove-item" data-id="${item.id}" style="color: #ef4444; font-size: 14px;">
                        <i class="fa-solid fa-trash"></i> <span data-en="Remove" data-ar="حذف">${lang === 'ar' ? 'حذف' : 'Remove'}</span>
                    </button>
                </div>
            </div>
        `).join('');

        // Attach listeners
        cartItemsContainer.querySelectorAll('.qty-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = parseInt(btn.dataset.id);
                const item = window.cart.items.find(i => i.id === id);
                if (!item) return;
                if (btn.dataset.action === 'increase') {
                    window.cart.updateQuantity(id, item.quantity + 1);
                } else {
                    window.cart.updateQuantity(id, item.quantity - 1);
                }
                renderCartPage();
            });
        });

        cartItemsContainer.querySelectorAll('.remove-item').forEach(btn => {
            btn.addEventListener('click', () => {
                window.cart.removeItem(parseInt(btn.dataset.id));
                renderCartPage();
            });
        });

        updateSummary();
    }

    function updateSummary() {
        const subtotal = window.cart.getSubtotal();
        const discount = subtotal * appliedDiscount;
        const afterDiscount = subtotal - discount;
        const tax = afterDiscount * 0.05;
        const total = afterDiscount + tax;

        document.getElementById('summarySubtotal').textContent = `$${subtotal.toFixed(2)}`;
        document.getElementById('summaryTax').textContent = `$${tax.toFixed(2)}`;
        document.getElementById('summaryDiscount').textContent = `-$${discount.toFixed(2)}`;
        document.getElementById('summaryTotal').textContent = `$${total.toFixed(2)}`;
    }

    // Apply coupon
    document.getElementById('applyCoupon').addEventListener('click', () => {
        const code = document.getElementById('couponInput').value.trim().toUpperCase();
        const msg = document.getElementById('couponMessage');

        if (couponCodes[code]) {
            appliedDiscount = couponCodes[code];
            msg.innerHTML = `<span style="color: #10b981;">✓ Coupon applied! ${appliedDiscount * 100}% discount</span>`;
            updateSummary();
        } else {
            msg.innerHTML = `<span style="color: #ef4444;">✗ Invalid coupon code</span>`;
        }
    });

    // Theme toggle
    const themeBtn = document.getElementById('themeBtn');
    const savedTheme = localStorage.getItem('kenven_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    themeBtn.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        const newTheme = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('kenven_theme', newTheme);
        themeBtn.querySelector('i').className = newTheme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    });

    renderCartPage();
});
</script>
</body>
</html>
